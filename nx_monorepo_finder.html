<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .finder-window {
    width: 860px;
    background: #2b2b2b;
    border-radius: 12px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.7), 0 0 0 0.5px rgba(255,255,255,0.08);
    overflow: hidden;
    font-size: 13px;
  }

  .title-bar {
    background: linear-gradient(180deg, #3d3d3d 0%, #333 100%);
    height: 38px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    border-bottom: 1px solid #1a1a1a;
    position: relative;
  }

  .traffic-light { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
  .tl-close { background: #ff5f57; }
  .tl-min   { background: #ffbd2e; }
  .tl-max   { background: #28c840; }

  .title-text {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.75);
    font-size: 13px;
    font-weight: 500;
  }

  .toolbar {
    background: #2e2e2e;
    height: 40px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 6px;
    border-bottom: 1px solid #1a1a1a;
  }
  .toolbar-btn {
    background: rgba(255,255,255,0.07);
    border: 0.5px solid rgba(255,255,255,0.1);
    border-radius: 5px;
    color: rgba(255,255,255,0.6);
    font-size: 11px;
    padding: 3px 8px;
    cursor: default;
  }

  .finder-body { display: flex; height: 540px; }

  .sidebar {
    width: 165px;
    background: #252525;
    border-right: 1px solid #1a1a1a;
    padding: 8px 0;
    flex-shrink: 0;
  }

  .sidebar-section-label {
    color: rgba(255,255,255,0.35);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    padding: 6px 12px 2px;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 10px 4px 14px;
    color: rgba(255,255,255,0.75);
    font-size: 12.5px;
    cursor: default;
    border-radius: 5px;
    margin: 0 5px;
  }
  .sidebar-item.active { background: rgba(58,130,246,0.35); color: white; }
  .sidebar-icon { font-size: 14px; }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    background: #2b2b2b;
  }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  .tree-item {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 6px;
    border-radius: 5px;
    cursor: default;
    user-select: none;
    white-space: nowrap;
  }
  .tree-item:hover { background: rgba(255,255,255,0.07); }
  .tree-item.selected { background: rgba(58,130,246,0.4); }

  .chevron {
    width: 13px; height: 13px;
    display: inline-flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.4);
    font-size: 8px;
    flex-shrink: 0;
  }
  .chevron.open { transform: rotate(90deg); }
  .chevron.leaf { opacity: 0; }

  .icon { font-size: 14px; flex-shrink: 0; }

  .label {
    font-size: 12.5px;
    color: rgba(255,255,255,0.85);
    line-height: 1.5;
  }
  .label.root-label { font-weight: 600; color: #fff; }

  .badge {
    margin-left: auto;
    font-size: 10px;
    color: rgba(255,255,255,0.28);
    font-style: italic;
    padding-right: 4px;
  }

  .comment {
    margin-left: 6px;
    font-size: 11px;
    color: rgba(255,185,80,0.55);
    font-style: italic;
  }

  .path-bar {
    height: 26px;
    background: #272727;
    border-top: 1px solid #1a1a1a;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 4px;
    color: rgba(255,255,255,0.4);
    font-size: 11px;
  }
  .path-crumb { color: rgba(255,255,255,0.55); }
</style>
</head>
<body>
<div class="finder-window">
  <div class="title-bar">
    <div class="traffic-light tl-close"></div>
    <div class="traffic-light tl-min"></div>
    <div class="traffic-light tl-max"></div>
    <div class="title-text">monorepo</div>
  </div>
  <div class="toolbar">
    <div class="toolbar-btn">&#9664;</div>
    <div class="toolbar-btn">&#9654;</div>
    <div class="toolbar-btn" style="margin-left:8px;">&#9783; List</div>
  </div>
  <div class="finder-body">
    <div class="sidebar">
      <div class="sidebar-section-label">Favorites</div>
      <div class="sidebar-item active"><span class="sidebar-icon">&#128187;</span> monorepo</div>
      <div class="sidebar-item"><span class="sidebar-icon">&#128193;</span> apps</div>
      <div class="sidebar-item"><span class="sidebar-icon">&#128193;</span> libs</div>
      <div class="sidebar-section-label" style="margin-top:8px;">Root Files</div>
      <div class="sidebar-item"><span class="sidebar-icon">&#128196;</span> nx.json</div>
      <div class="sidebar-item"><span class="sidebar-icon">&#128196;</span> package.json</div>
    </div>
    <div class="content">
      <div id="tree"></div>
    </div>
  </div>
  <div class="path-bar">
    <span class="path-crumb">monorepo</span>
  </div>
</div>

<script>
const nodes = [
  { id:'apps', label:'apps', icon:'&#128193;', depth:0, open:true },
    { id:'appname', label:'{application-name}', icon:'&#128193;', depth:1, open:true },
      { id:'devops', label:'.devops', icon:'&#128296;', depth:2, open:false },
      { id:'src', label:'src', icon:'&#128193;', depth:2, open:true },
        { id:'contract', label:'contract', icon:'&#128193;', depth:3, open:true },
          { id:'apireq', label:'api-request', icon:'&#128193;', depth:4, open:false },
          { id:'apires', label:'api-response', icon:'&#128193;', depth:4, open:false },
          { id:'kafkaev', label:'kafka-events', icon:'&#9889;', depth:4, open:false },
          { id:'kafkasc', label:'kafka-schema', icon:'&#9889;', depth:4, open:false },
          { id:'pgmodels', label:'postgres-models', icon:'&#128024;', depth:4, open:false },
        { id:'ctrl', label:'controllers', icon:'&#128193;', depth:3, open:false },
        { id:'svc', label:'services', icon:'&#128193;', depth:3, open:false },
        { id:'repo', label:'repositories', icon:'&#128193;', depth:3, open:false },
        { id:'guards', label:'guards', icon:'&#128737;', depth:3, open:false },
        { id:'inter', label:'interceptors', icon:'&#128193;', depth:3, open:false },
        { id:'pipes', label:'pipes', icon:'&#128193;', depth:3, open:false },
        { id:'mid', label:'middlewares', icon:'&#128193;', depth:3, open:false },

  { id:'libs', label:'libs', icon:'&#128193;', depth:0, open:true },
    { id:'domain', label:'{domain-name}', icon:'&#128193;', depth:1, open:true },
      { id:'team', label:'{team-name}', icon:'&#128193;', depth:2, open:true },
        { id:'feecalc', label:'fee-calculator', icon:'&#129518;', depth:3, open:false, comment:'# domain team only' },
    { id:'shared', label:'shared', icon:'&#128193;', depth:1, open:true },
      { id:'infra', label:'infrastructure', icon:'&#127959;', depth:2, open:false, comment:'# all apps' },
      { id:'tests', label:'tests', icon:'&#129514;', depth:2, open:false },
      { id:'da', label:'data-access', icon:'&#128451;', depth:2, open:false },

  { id:'pkgjson', label:'package.json', icon:'&#128196;', depth:0, isFile:true },
  { id:'nxjson', label:'nx.json', icon:'&#128196;', depth:0, isFile:true },
];

function build() {
  const tree = document.getElementById('tree');
  nodes.forEach(node => {
    const row = document.createElement('div');
    row.className = 'tree-item';
    row.style.paddingLeft = (6 + node.depth * 18) + 'px';

    const chev = document.createElement('span');
    chev.className = 'chevron' + (node.isFile ? ' leaf' : node.open ? ' open' : '');
    chev.innerHTML = '&#9654;';

    const ico = document.createElement('span');
    ico.className = 'icon';
    ico.innerHTML = node.icon;

    const lbl = document.createElement('span');
    lbl.className = 'label' + (node.depth === 0 ? ' root-label' : '');
    lbl.textContent = node.label;

    row.appendChild(chev);
    row.appendChild(ico);
    row.appendChild(lbl);

    if (node.comment) {
      const c = document.createElement('span');
      c.className = 'comment';
      c.textContent = node.comment;
      row.appendChild(c);
    }

    row.addEventListener('click', () => {
      document.querySelectorAll('.tree-item.selected').forEach(el => el.classList.remove('selected'));
      row.classList.add('selected');
    });

    tree.appendChild(row);
  });
}

build();
</script>
</body>
</html>
